name: Sécurité (réutilisable)

# Les vérifications qui ne dépendent d'aucun outil externe et qui, chacune,
# ferment un constat d'audit nommé. Une barrière CI dont on ne sait pas quel
# scénario elle ferme est une barrière qu'on désactivera le jour où elle gêne.

on:
  workflow_call:
    inputs:
      solidity:
        description: "Exécuter aussi les règles propres aux contrats Solidity"
        type: boolean
        default: false
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  secrets:
    name: Aucun secret, aucune donnée personnelle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # Pas de dépendance externe : gitleaks-action exige une licence pour les
      # organisations, et une barrière qui échoue pour une raison administrative
      # finit désactivée. Dix motifs, exécutés partout, sans réseau.
      - name: Motifs sensibles
        run: |
          set -uo pipefail
          exclusions=':(exclude)lib/:(exclude)out/:(exclude)cache/'
          echec=0

          verifier() {
            nom="$1"; motif="$2"
            trouve=$(git grep -nIiE "$motif" -- . $exclusions || true)
            if [ -n "$trouve" ]; then
              echo "::error::$nom détecté"
              echo "$trouve" | head -20
              echec=1
            fi
          }

          verifier "Clé privée PEM"       '-----BEGIN [A-Z ]*PRIVATE KEY-----'
          verifier "Jeton AWS"            'AKIA[0-9A-Z]{16}'
          verifier "Jeton GitHub"         'gh[pousr]_[A-Za-z0-9]{16,}'
          verifier "Jeton Slack"          'xox[baprs]-[A-Za-z0-9-]{10,}'
          # La valeur doit être ENTRE GUILLEMETS : sans cette contrainte, le motif
          # attrape `token = new MockERC20()` et toute affectation Solidity, et une
          # barrière qui crie au loup est une barrière qu'on finit par désactiver.
          verifier "Secret affecté"       '(api[_-]?key|secret|passwd|password|access[_-]?token|auth[_-]?token|bearer)[[:space:]]*[:=][[:space:]]*['"'"'"][^'"'"'"]{8,}'
          verifier "Chemin utilisateur"   '[A-Za-z]:[\\/]Users[\\/][A-Za-z0-9._-]+'
          verifier "Clé privée hex"       '\b0x[0-9a-fA-F]{64}\b'

          # L'adresse personnelle du porteur ne doit jamais entrer dans
          # l'historique : les commits portent une adresse noreply (ADR-026).
          verifier "Adresse personnelle"  '[A-Za-z0-9._%+-]+@(gmail|yahoo|hotmail|outlook)\.[A-Za-z]{2,}'

          exit $echec

      - name: Aucune mention d'assistance IA dans les messages de commit
        run: |
          set -uo pipefail
          # CLAUDE.md §4.8 : le projet est présenté comme le travail d'une
          # personne seule devant des partenaires institutionnels.
          if git log --format='%B' | grep -inE 'co-authored-by|generated with|anthropic|claude'; then
            echo "::error::message de commit mentionnant une assistance IA"
            exit 1
          fi
          echo "OK — aucun message ne mentionne d'assistance"

  solidity:
    name: Règles propres au protocole
    if: ${{ inputs.solidity }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # ---- I-68 (constat D-04) --------------------------------------------
      - name: Deal n'accorde jamais d'allocation
        run: |
          set -uo pipefail
          if grep -rnE '\b(approve|increaseAllowance|permit)[[:space:]]*\(' src/; then
            echo "::error::I-68 — Deal ne doit jamais accorder d'allocation."
            echo "Une allocation est une sortie de fonds différée : elle ne viole"
            echo "ni la comptabilité interne, ni la règle sur token.transfer."
            exit 1
          fi
          echo "OK — aucune allocation accordée"

      # ---- I-27 -----------------------------------------------------------
      - name: Aucun delegatecall, aucun selfdestruct
        run: |
          set -uo pipefail
          if grep -rnE '\b(delegatecall|selfdestruct)[[:space:]]*\(' src/; then
            echo "::error::I-27 — Deal n'est jamais upgradable et n'a pas de propriétaire."
            exit 1
          fi
          echo "OK"

      # ---- ADR-021, règle corrigée après le constat D-04 -------------------
      - name: Un seul point de sortie de tokens
        run: |
          set -uo pipefail
          n=$(grep -rn 'IERC20Minimal.transfer\b' src/ | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "::error::ADR-021 — exactement un appel à token.transfer est attendu, $n trouvé(s)."
            echo "Les quatre décisions de sortie CRÉDITENT une comptabilité ;"
            echo "seule withdraw() transfère réellement des jetons."
            grep -rn 'IERC20Minimal.transfer\b' src/
            exit 1
          fi
          echo "OK — un seul appel, dans _tryTransfer (withdraw)"

      # ---- Lexique imposé (GLOSSARY.md) -----------------------------------
      - name: Lexique du domaine
        run: |
          set -uo pipefail
          echec=0
          for interdit in validator verifier buyer seller payee payer; do
            if grep -rniE "\b${interdit}\b" src/ ; then
              echo "::error::GLOSSARY — « $interdit » est proscrit."
              echo "Un synonyme n'est pas une élégance de style : c'est une ambiguïté"
              echo "qui produit un bug que la revue ne voit pas."
              echec=1
            fi
          done
          exit $echec
