name: Foundry

on:
  workflow_call:
    inputs:
      coverage-threshold:
        type: number
        default: 90

permissions:
  contents: read

jobs:
  qualite:
    name: Build, tests, couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Formatage
        run: forge fmt --check

      - name: Compilation
        run: forge build --sizes

      - name: Tests
        run: forge test -vv

      - name: Couverture
        env:
          SEUIL: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail
          forge coverage --ir-minimum --report summary | tee /tmp/cov.txt
          {
            echo "## Couverture"
            echo '```'
            grep -E '^\|' /tmp/cov.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echec=0
          grep -E '^\| src/' /tmp/cov.txt > /tmp/src.txt || true
          while IFS= read -r ligne; do
            fichier=$(echo "$ligne" | awk -F'|' '{gsub(/ /,"",$2); print $2}')
            pct=$(echo "$ligne" | awk -F'|' '{print $3}' | awk '{print $1}' | tr -d '%')
            [ -z "$pct" ] && continue
            if awk -v p="$pct" -v s="$SEUIL" 'BEGIN{exit !(p+0 < s+0)}'; then
              echo "::error::$fichier couverture $pct % inferieure au seuil $SEUIL %"
              echec=1
            else
              echo "OK $fichier : $pct %"
            fi
          done < /tmp/src.txt
          exit $echec

      - name: Instantane de gaz
        run: |
          set -euo pipefail
          if [ -f .gas-snapshot ]; then
            forge snapshot --check --tolerance 5
          else
            echo "::warning::aucun .gas-snapshot versionne"
          fi
